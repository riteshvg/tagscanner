.spinner {
        width: 64px;

        border-radius: 50%;
        animation: spin-anim 1.2s linear infinite;
      }

      @keyframes spin-anim {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg)
        }
      }

      .loader-container {

      }
    table {

        width: 100%;
      }
      td, th {
        border: 1px solid #dddddd;
        text-align: left;
        padding: 8px;
      }
      
      tr:nth-child(even) {

      }
    </style>
