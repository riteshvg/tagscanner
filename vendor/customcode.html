<!DOCTYPE html>
<html>
  <head>
    <title>Custom Code in Data Elements</title>
    <link
      rel="stylesheet"
      href="fontawesome-free/css/all.min.css"
    />
    <link href="../css/sb-admin-2.min.css" rel="stylesheet" />
    <link
      href="../vendor/datatables/dataTables.bootstrap4.min.css"
      rel="stylesheet"
    />
    <style>
      .spinner {
        width: 64px;
        height: 64px;
        border: 8px solid;
        border-color: #3d5af1 transparent #3d5af1 transparent;
        border-radius: 50%;
        animation: spin-anim 1.2s linear infinite;
      }

      @keyframes spin-anim {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .loader-container {
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        position: fixed;
        background: white;
        z-index: 1;
      }

      pre {
        background-color: #f8f9fc;
        border: 1px solid #e3e6f0;
        border-radius: 0.35rem;
        padding: 1rem;
        max-height: 300px;
        overflow: auto;
        white-space: pre-wrap;
      }

      .code-container {
        margin-bottom: 2rem;
        border: 1px solid #e3e6f0;
        border-radius: 0.35rem;
        padding: 1rem;
      }

      .code-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.5rem;
      }

      .code-title {
        font-weight: bold;
        color: #4e73df;
      }
    </style>
  </head>
  <body>
    <div class="loader-container" id="set_display">
      <div class="spinner"></div>
    </div>

    <div class="container-fluid">
      <div>&nbsp;</div>
      <div style="background-color: #27c5c1">
        <h5 style="color: black">Custom Code in Data Elements</h5>
        <h6 class="download-button" style="text-align: right"></h6>
      </div>

      <div class="row mt-3">
        <div class="col-12">
          <input
            type="text"
            id="searchInput"
            class="form-control mb-3"
            placeholder="Search for data element names..."
          />
        </div>
      </div>

      <div id="customCodeContainer"></div>
    </div>

    <script src="jquery/jquery.min.js"></script>
    <script src="aiClient.js"></script>
    <script src="auth.js"></script>
    <script src="bedrockClient.js"></script>
    <script src="customcode.js"></script>
  </body>
</html>
