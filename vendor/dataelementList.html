    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: #f8f9fc;
      }
      .container-fluid {
        max-width: 1200px;
        margin: 0 auto;
      }
      .header {
        background-color: #4e73df;
        color: white;
        padding: 15px;
        border-radius: 5px;
        margin-bottom: 20px;
      }
      .header h5 {
        margin: 0;
      }
      .back-link {
        float: left;
        width: 4%;
        margin-right: 10px;
      }
      .back-link img {
        height: 24px;
      }
      .card {
        background-color: white;
        border: none;
        border-radius: 5px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        margin-bottom: 20px;
      }
      .card-header {
        background-color: #f8f9fc;
        border-bottom: 1px solid #e3e6f0;
        padding: 15px;
      }
      .card-header h6 {
        margin: 0;
        font-weight: bold;
        color: #4e73df;
      }
      .card-body {
        padding: 20px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 12px 15px;
        text-align: left;
        border-bottom: 1px solid #e3e6f0;
      }
      th {
        background-color: #f8f9fc;
        font-weight: bold;
        color: #4e73df;
      }
      tr:hover {
        background-color: #f8f9fc;
      }
      .no-data {
        text-align: center;
        padding: 20px;
        color: #858796;
        font-style: italic;
      }
      .loader-container {
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        position: fixed;
        background: white;
        z-index: 1;
      }
      .spinner {
        width: 64px;
        height: 64px;
        border: 8px solid;
        border-color: #3d5af1 transparent #3d5af1 transparent;
        border-radius: 50%;
        animation: spin-anim 1.2s linear infinite;
      }
      @keyframes spin-anim {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .variable-path {
        font-size: 12px;
        color: #858796;
        font-style: italic;
      }
      .badge {
        padding: 5px 10px;
        border-radius: 15px;
        font-size: 12px;
        font-weight: normal;
      }
      .badge-primary {
        background-color: #4e73df;
        color: white;
      }
      .badge-success {
        background-color: #1cc88a;
        color: white;
      }
      .badge-info {
        background-color: #36b9cc;
        color: white;
      }
      .badge-warning {
        background-color: #f6c23e;
        color: white;
      }
      .select-container {
        margin-bottom: 20px;
      }
      select.form-control {
        height: 45px;
        font-size: 16px;
      }
      .btn-primary {
        background-color: #4e73df;
        border-color: #4e73df;
        padding: 10px 20px;
        font-size: 16px;
      }
      .btn-primary:hover {
        background-color: #2e59d9;
        border-color: #2e59d9;
      }
      .results-section {
        display: none;
      }
      .variable-count {
        font-size: 14px;
        color: #858796;
        margin-left: 10px;
      }
      .variable-type-selector {
        display: flex;
        margin-bottom: 20px;
      }
      .variable-type-selector .btn {
        flex: 1;
        margin-right: 10px;
      }
      .variable-type-selector .btn:last-child {
        margin-right: 0;
      }
      .btn-outline-primary {
        color: #4e73df;
        border-color: #4e73df;
      }
      .btn-outline-primary.active {
        background-color: #4e73df;
        color: white;
      }
      .rule-list {
        margin-top: 5px;
      }
      .rule-item {
        display: inline-block;
        margin-right: 5px;
        margin-bottom: 5px;
      }
    </style>
  </head>
