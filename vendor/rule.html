<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rules Page</title>
    <script src="intro.js"></script>
    <link
      href="../vendor/fontawesome-free/css/all.min.css"
      rel="stylesheet"
      type="text/css"
    />
    <link href="../css/sb-admin-2.min.css" rel="stylesheet" />
    <link href="../css/styles.css" rel="stylesheet" />
    <link href="intro.css" rel="stylesheet" />
    <style>
      table {
        font-family: arial, sans-serif;
        border-collapse: collapse;
        width: 100%;
      }
      th {
        position: sticky;
        top: 0;
        background: #f1f1f1;
        z-index: 2;
      }
      td,
      th {
        border: 1px solid #dddddd;
        text-align: left;
        padding: 8px;
      }

      /* Modern styling matching summary.html */
      .summary-card {
        border-radius: 8px;
        margin-bottom: 20px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
      .summary-card-header {
        padding: 15px;
        border-radius: 8px 8px 0 0;
        font-weight: bold;
        color: white;
      }
      .summary-card-body {
        padding: 20px;
      }
      .rule-card .summary-card-header {
        background-color: #f68d2e;
      }
      .download-section {
        margin-top: 30px;
        margin-bottom: 40px;
        text-align: center;
      }
      .description-text {
        margin-top: 10px;
        margin-bottom: 15px;
      }

      /* Spinner and loader */
      .spinner {
        width: 64px;
        height: 64px;
        border: 8px solid;
        border-color: #3d5af1 transparent #3d5af1 transparent;
        border-radius: 50%;
        animation: spin-anim 1.2s linear infinite;
      }

      @keyframes spin-anim {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }

      .loader-container {
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position: fixed;
        background: rgba(255, 255, 255, 0.9);
        z-index: 1;
      }

      .loading-message {
        margin-top: 15px;
        font-size: 16px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div class="loader-container" id="set_display">
      <div class="spinner"></div>
      <div class="loading-message">
        <p>Loading rules data...</p>
      </div>
    </div>

    <div class="container-fluid">
      <div
        style="
          background-color: #4e73df;
          display: flex;
          justify-content: space-between;
          align-items: center;
        "
      >
        <h5 style="color: white; padding: 10px; margin-bottom: 0">Rules</h5>
        <button
          id="start-tour"
          class="btn btn-light btn-sm"
          style="margin-right: 10px"
        >
          <i class="fas fa-map-marked-alt mr-2"></i> Take a Tour
        </button>
      </div>

      <div class="description-text">
        This page shows all rules defined in your Adobe Tags property. You can
        sort the table by clicking on any column header.
      </div>

      <div class="summary-card rule-card">
        <div class="summary-card-header">
          <i class="fas fa-wrench mr-2"></i> Rules Details
          <h6
            class="download-button"
            style="text-align: right; margin-top: -20px"
          ></h6>
        </div>
        <div class="summary-card-body">
          <table id="rule_details" style="width: 100%"></table>
          <div
            class="pagination-container"
            style="margin-top: 20px; text-align: center"
          >
            <button id="prevPage" class="btn btn-primary btn-sm" disabled>
              <i class="fas fa-chevron-left"></i> Previous
            </button>
            <span id="pageInfo" style="margin: 0 15px"
              >Page <span id="currentPage">1</span> of
              <span id="totalPages">1</span></span
            >
            <button id="nextPage" class="btn btn-primary btn-sm">
              Next <i class="fas fa-chevron-right"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Remove the download section with tour button -->
    <div class="container-fluid">
      <div class="download-section"></div>
    </div>

    <!-- Scripts -->
    <script src="jquery.js"></script>
    <script src="tablesorter.js"></script>
    <script src="initTableSorter.js"></script>
    <script src="tour-initializer.js"></script>
    <script src="rule-tour.js"></script>
    <script src="rule.js"></script>
  </body>
</html>
